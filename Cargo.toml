[package]
name = "rometric"
version = "0.1.0"
edition = "2021"
description = "Rometric system-wide equalizer for Windows"
license = "MIT"

[dependencies]
# Embedded AutoEQ asset (zlib, pure-Rust backend)
flate2 = "1"
# Settings persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The desktop shell and audio I/O are Windows-only, which also keeps the core
# library testable on any host without ALSA/X11 headers.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
cpal = "0.15"
rfd = "0.15"
tray-icon = "0.20"
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "rometric"
path = "src/main.rs"

[[bin]]
name = "selftest"
path = "src/bin/selftest.rs"
